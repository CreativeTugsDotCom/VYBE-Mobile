            },
            coral: {
              DEFAULT: '#FF6B6B',
              soft: '#FFEAEA'
            },
            surface: '#F7F7FB',
            cardDark: '#171D2E',
            borderDark: '#232A3E'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
          }
        }
      }

  </script>

  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #101522;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a344f;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #7657F5;
    }
    
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Ambient background grid */
    .bg-grid-ambient {
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
  </style>
</head>

      {

        curatorFollowers: '48.2k',
        curatorRating: '4.98',

        rating: 4.99,
        reviewsCount: 420,

        price: 55,
        tag: 'EDITORIAL PICK',
        highDemand: true,

      }
    ];

    const CATEGORIES = ['All', 'Music', 'Visual Arts', 'Creative Labs', 'Secret Events'];

    function App() {
      const [viewMode, setViewMode] = useState('single'); // 'single' | 'board'
      const [activeScreen, setActiveScreen] = useState('home');
      const [selectedExperience, setSelectedExperience] = useState(INITIAL_EXPERIENCES[0]);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('All');
      const [savedIds, setSavedIds] = useState(['exp-1', 'exp-3']);
      const [isFollowingCreator, setIsFollowingCreator] = useState(false);
      const [ticketCount, setTicketCount] = useState(2);
      const [selectedSlot, setSelectedSlot] = useState('slot-1');
      const [paymentMethod, setPaymentMethod] = useState('apple');
      const [bookingSuccess, setBookingSuccess] = useState(false);
      const [notification, setNotification] = useState(null);

      // Re-initialize Lucide Icons after DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const triggerNotification = (text) => {
        setNotification(text);
        setTimeout(() => setNotification(null), 2500);
      };

      const toggleSave = (id, e) => {
        if (e) e.stopPropagation();
        if (savedIds.includes(id)) {
          setSavedIds(savedIds.filter(item => item !== id));
          triggerNotification('Removed from Saved Vybes');
        } else {
          setSavedIds([...savedIds, id]);
          triggerNotification('Saved to your Vybe Vault');
        }
      };

      const openExperienceDetails = (exp) => {
        setSelectedExperience(exp);
        setActiveScreen('details');
      };

      const openCreatorProfile = (creatorName) => {
        const found = INITIAL_EXPERIENCES.find(e => e.curator === creatorName);
        if (found) setSelectedExperience(found);
        setActiveScreen('creator');
      };

      const proceedToBooking = (exp) => {
        setSelectedExperience(exp);
        setBookingSuccess(false);
        setActiveScreen('booking');
      };

      const handleConfirmBooking = () => {
        setBookingSuccess(true);
        triggerNotification('Booking Confirmed! Pass added to wallet.');
        setTimeout(() => {
          setActiveScreen('profile');
          setBookingSuccess(false);
        }, 1200);
      };

      const filteredExperiences = useMemo(() => {
        return INITIAL_EXPERIENCES.filter(exp => {
          const matchCat = activeCategory === 'All' || exp.category === activeCategory;
          const matchSearch = exp.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              exp.location.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              exp.curator.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [searchQuery, activeCategory]);

      const passUnitPrice = selectedExperience.price;
      const passSubtotal = passUnitPrice * ticketCount;
      const curatorGearFee = 12.50;
      const tax = Number((passSubtotal * 0.08875).toFixed(2));
      const totalAmount = (passSubtotal + curatorGearFee + tax).toFixed(2);

      // --- REUSABLE SMARTPHONE CHASSIS ---
      const SmartphoneChassis = ({ screenId, interactive = true }) => {
        return (
          <div className="relative mx-auto w-[360px] sm:w-[380px] h-[770px] rounded-[52px] bg-[#1a1e2b] p-3 shadow-[0_25px_60px_-15px_rgba(118,87,245,0.3),0_15px_35px_-10px_rgba(16,21,34,0.6)] border-[2.5px] border-[#2f374e] flex flex-col flex-shrink-0 transition-transform duration-300">
            {/* Dynamic Island */}
            <div className="absolute top-4 left-1/2 -translate-x-1/2 w-28 h-7 bg-black rounded-full z-50 flex items-center justify-between px-3.5 shadow-md">
              <div className="w-2.5 h-2.5 rounded-full bg-[#081122] border border-[#1c263c]" />
              <div className="flex items-center gap-1.5">
                <span className="text-[9px] font-bold text-coral tracking-wider">VYBE</span>
                <div className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse" />
              </div>
              <div className="w-2 h-2 rounded-full bg-[#0a0e17]" />
            </div>

            {/* In-App Toast Banner */}
            {notification && (
              <div className="absolute top-14 left-6 right-6 z-50 animate-bounce">
                <div className="bg-violet text-white text-[11px] font-bold px-3 py-2 rounded-xl shadow-xl flex items-center justify-between border border-white/20">
                  <span className="flex items-center gap-1.5">
                    <i data-lucide="sparkles" className="w-3.5 h-3.5 text-coral"></i>
                    {notification}
                  </span>
                  <i data-lucide="x" className="w-3 h-3 cursor-pointer" onClick={() => setNotification(null)}></i>
                </div>
              </div>
            )}

            {/* Inner Phone Viewport */}
            <div className="relative w-full h-full rounded-[42px] overflow-hidden bg-midnight text-white flex flex-col select-none">
              <div className="flex-1 overflow-y-auto no-scrollbar pb-20 pt-11 px-4">
                {screenId === 'home' && renderHomeScreen()}
                {screenId === 'explore' && renderExploreScreen()}
                {screenId === 'details' && renderDetailsScreen()}
                {screenId === 'creator' && renderCreatorScreen()}
                {screenId === 'booking' && renderBookingScreen()}
                {screenId === 'profile' && renderProfileScreen()}
              </div>

              {screenId !== 'booking' && renderBottomNav(screenId)}

              <div className="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/40 rounded-full z-50 pointer-events-none" />

              </div>

          <div className="flex gap-2 overflow-x-auto no-scrollbar py-1">
            {CATEGORIES.map(cat => (
              <button
                key={cat}
                onClick={() => { setActiveCategory(cat); setActiveScreen('explore'); }}
                className={`px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
                  activeCategory === cat 
                    ? 'bg-violet text-white shadow-md shadow-violet/30' 
                    : 'bg-cardDark text-slate-300 border border-white/5 hover:border-violet/40'

          <div>
            <div className="flex items-center justify-between mb-2">

                <i data-lucide="sparkles" className="w-3.5 h-3.5 text-violet"></i> Trending Discoveries
              </span>
              <span className="text-[10px] font-semibold text-violet cursor-pointer" onClick={() => setActiveScreen('explore')}>
                View Grid
              </span>
            </div>

            <div className="grid grid-cols-2 gap-3">
              {INITIAL_EXPERIENCES.slice(1, 3).map(exp => (
                <div 
                  key={exp.id}
                  onClick={() => openExperienceDetails(exp)}
                  className="bg-cardDark rounded-2xl p-2.5 border border-white/5 hover:border-violet/40 transition cursor-pointer group"
                >
                  <div className="relative h-28 rounded-xl overflow-hidden mb-2">
                    <img src={exp.coverImage} alt={exp.title} className="w-full h-full object-cover group-hover:scale-105 transition" />
                    <span className="absolute bottom-1.5 right-1.5 bg-black/70 backdrop-blur-md text-[9px] px-1.5 py-0.5 rounded text-white font-mono">
                      {exp.price === 28 ? 'Sat 9 PM' : 'Sun 2 PM'}
                    </span>
                    <button 
                      onClick={(e) => toggleSave(exp.id, e)}
                      className="absolute top-1.5 right-1.5 p-1 rounded-full bg-black/50 text-white"
                    >
                      <i data-lucide={savedIds.includes(exp.id) ? "bookmark-check" : "bookmark"} className={`w-3 h-3 ${savedIds.includes(exp.id) ? 'text-coral fill-coral' : ''}`}></i>

                  <div className="flex items-center justify-between mt-2 pt-1.5 border-t border-white/5 text-xs">
                    <span className="font-bold text-coral">${exp.price}</span>
                    <span className="text-[10px] text-slate-400 flex items-center gap-0.5">
                      <i data-lucide="star" className="w-2.5 h-2.5 text-amber-400 fill-amber-400"></i> {exp.rating}
                    </span>

          </div>

          <div>
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                <i data-lucide="users" className="w-3.5 h-3.5 text-violet"></i> Featured Creators
              </span>
              <span className="text-[10px] font-semibold text-violet cursor-pointer" onClick={() => setActiveScreen('creator')}>
                Meet Artists
              </span>
            </div>

            <div className="flex gap-3 overflow-x-auto no-scrollbar pb-1">
              {INITIAL_EXPERIENCES.map((exp, idx) => (
                <div 
                  key={idx}
                  onClick={() => openCreatorProfile(exp.curator)}
                  className="flex flex-col items-center flex-shrink-0 w-20 cursor-pointer group"
                >
                  <div className="relative">
                    <div className="w-14 h-14 rounded-full p-0.5 bg-gradient-to-tr from-violet to-coral group-hover:scale-105 transition">
                      <img src={exp.curatorAvatar} alt={exp.curator} className="w-full h-full object-cover rounded-full" />
                    </div>
                    <span className="absolute -bottom-0.5 -right-0.5 bg-violet text-white rounded-full p-0.5 ring-2 ring-midnight">
                      <i data-lucide="check" className="w-2.5 h-2.5"></i>
                    </span>
                  </div>
                  <span className="text-[11px] font-medium text-white truncate w-full text-center mt-1.5">{exp.curator}</span>
                  <span className="text-[9px] text-slate-400 truncate w-full text-center">{exp.category}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      // --- SCREEN 02: EXPLORE ---
      const renderExploreScreen = () => (
        <div className="space-y-4">
          <div className="flex items-center justify-between pt-1">
            <div>
              <span className="text-[10px] uppercase font-bold tracking-widest text-violet">Curated Directory</span>
              <h3 className="text-lg font-black text-white">Discover Scene</h3>
            </div>
            <div className="flex items-center gap-1.5 bg-white/5 border border-white/10 px-3 py-1.5 rounded-xl text-xs font-medium">
              <i data-lucide="map-pin" className="w-3.5 h-3.5 text-coral"></i>
              <span>New York</span>
            </div>
          </div>

          <div className="relative">
            <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input 
              type="text" 
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}

              className="w-full bg-cardDark text-xs text-white placeholder-slate-400 pl-10 pr-9 py-3 rounded-2xl border border-white/10 focus:outline-none focus:border-violet"
            />
